<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CE Workforce Management Suite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:        #0b0f1a;
      --surface:   #111827;
      --border:    #1e2d45;
      --accent:    #00c2ff;
      --accent2:   #7b5ea7;
      --text:      #e2e8f0;
      --muted:     #64748b;
      --tab-h:     56px;
      --header-h:  64px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Sora', sans-serif;
      overflow: hidden;
    }

    /* ── HEADER ── */
    header {
      height: var(--header-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 16px;
      position: relative;
      z-index: 10;
    }

    .logo-mark {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      font-weight: 500;
      color: #fff;
      letter-spacing: -0.5px;
      flex-shrink: 0;
    }

    .header-title {
      display: flex;
      flex-direction: column;
    }

    .header-title span:first-child {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--text);
    }

    .header-title span:last-child {
      font-size: 11px;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      letter-spacing: 0.05em;
    }

    .header-divider {
      width: 1px;
      height: 28px;
      background: var(--border);
      margin: 0 8px;
    }

    /* ── TAB NAV ── */
    nav {
      display: flex;
      align-items: stretch;
      gap: 4px;
      height: 100%;
    }

    .tab-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 20px;
      height: 100%;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      font-family: 'Sora', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
      white-space: nowrap;
    }

    .tab-btn:hover { color: var(--text); }

    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .tab-btn.active .tab-icon { opacity: 1; }

    .tab-icon {
      width: 20px;
      height: 20px;
      opacity: 0.5;
      transition: opacity 0.2s;
      flex-shrink: 0;
    }

    .tab-badge {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--border);
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .tab-btn.active .tab-badge {
      background: color-mix(in srgb, var(--accent) 15%, transparent);
      color: var(--accent);
    }

    .header-spacer { flex: 1; }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      padding: 5px 12px;
      border: 1px solid var(--border);
      border-radius: 20px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    /* ── IFRAME CONTAINER ── */
    .frame-wrapper {
      position: absolute;
      top: var(--header-h);
      left: 0;
      right: 0;
      bottom: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .frame-wrapper.active {
      opacity: 1;
      pointer-events: all;
    }

    .frame-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* ── LOADING OVERLAY ── */
    .frame-loader {
      position: absolute;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 5;
      transition: opacity 0.3s ease;
    }

    .frame-loader.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loader-spinner {
      width: 36px;
      height: 36px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loader-label {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-mark">WFM</div>
    <div class="header-title">
      <span>CE Workforce Management Suite</span>
      <span>InStride Health · Clinical Operations</span>
    </div>
    <div class="header-divider"></div>
    <nav>

      <!-- Tab 1 -->
      <button class="tab-btn active" data-target="frame-licensing" onclick="switchTab(this)">
        <svg class="tab-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="2" y="3" width="16" height="14" rx="2"/>
          <path d="M6 7h8M6 10h5M6 13h3"/>
        </svg>
        Licensing &amp; PTO
        <span class="tab-badge">OPERATIONAL</span>
      </button>

      <!-- Tab 2 -->
      <button class="tab-btn" data-target="frame-arbitrage" onclick="switchTab(this)">
        <svg class="tab-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M3 14l4-5 4 3 5-7"/>
          <circle cx="17" cy="5" r="1.5" fill="currentColor" stroke="none"/>
        </svg>
        Supply / Demand Forecast
        <span class="tab-badge">STRATEGIC</span>
      </button>

    </nav>
    <div class="header-spacer"></div>
    <div class="status-pill">
      <div class="status-dot"></div>
      LIVE
    </div>
  </header>

  <!-- Frame 1: Licensing & PTO -->
  <div class="frame-wrapper active" id="frame-licensing">
    <div class="frame-loader" id="loader-licensing">
      <div class="loader-spinner"></div>
      <div class="loader-label">LOADING LICENSING MODEL...</div>
    </div>
    <iframe
      src="https://alexmariscal-strider.github.io/CE-Licensing-Capacity-Mix/"
      title="CE Licensing & Capacity Mix"
      onload="hideLoader('loader-licensing')"
    ></iframe>
  </div>

  <!-- Frame 2: Supply/Demand Forecast -->
  <div class="frame-wrapper" id="frame-arbitrage">
    <div class="frame-loader" id="loader-arbitrage">
      <div class="loader-spinner"></div>
      <div class="loader-label">LOADING FORECAST MODEL...</div>
    </div>
    <iframe
      src="https://alexmariscal-strider.github.io/CE-PFA-v2/"
      title="CE + PFA Capacity Arbitrage"
      onload="hideLoader('loader-arbitrage')"
    ></iframe>
  </div>

  <script>
    function switchTab(btn) {
      // deactivate all tabs
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.frame-wrapper').forEach(f => f.classList.remove('active'));

      // activate selected
      btn.classList.add('active');
      document.getElementById(btn.dataset.target).classList.add('active');
    }

    function hideLoader(id) {
      const loader = document.getElementById(id);
      if (loader) loader.classList.add('hidden');
    }
  </script>

</body>
</html>
